{% set name = "unidock2" %}

{% if cuda_compiler_version in (None, "None", True, False) %}
{% set cuda_major = 0 %}
{% else %}
{% set cuda_major = environ.get("cuda_compiler_version").split(".")[0] | int %}
{% endif %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..

build:
  number: {{ build }}
  # skip: true

requirements:
  build:
    # - cross-python_{{ target_platform }}
    # - cython                                 # [build_platform != target_platform]
    - {{ compiler('c') }}
#    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - {{ compiler('cuda') }} # [(linux or win) and cuda_compiler != "None"]
    - cmake >=3.27
    - make
    - pybind11

  host:
    - python
    - pip
    - scikit-build-core >=0.2.0
    # - cython
    - setuptools
    - cuda-version {{ cuda_compiler_version }} # [(cuda_compiler_version or "None") != "None"]
    {% if cuda_compiler_version != "None" %}
    - libcurand-dev
    - cuda-cudart-dev
    - cuda-driver-dev  # [linux]
    {% endif %}
  run:
    - pyyaml
    - pydantic
    - pathos
    - numpy
    - scipy
    - pandas
    - networkx
    - rdkit
    - mdanalysis
    - pdbfixer
    - openmm
    - msys_viparr_lpsolve55
    - ambertools_stable
    # the CNN rescoring stage (unidock_processing/cnn_rescore): torch in every build, libmolgrid's CUDA gridder in the
    # CUDA builds (conda-forge ships molgrid for linux-64 CUDA only; its CUDA 12 builds, 0.5.5, need cuda-version >=12.6)
    - pytorch
    - molgrid  # [linux and (cuda_compiler_version or "None") != "None"]
    # molgrid 0.5.5 links libopenbabel.so.7 (openbabel 3.1) but its conda-forge builds declare 'openbabel >=3' with no upper
    # bound; openbabel 3.2 ships libopenbabel.so.8, so 'import molgrid' fails and the stage falls back to the torch gridder
    - openbabel 3.1.*  # [linux and (cuda_compiler_version or "None") != "None"]

test:
  imports:
    - unidock_engine
    - unidock_processing
